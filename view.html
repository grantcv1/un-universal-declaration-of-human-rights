<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Declaration in Akoma Ntoso</title>
<style>
:root{--g:#0c2d57;--b:#0b5cad}
html,body{margin:0;background:var(--g)}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 12px;background:var(--g);font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}
.tabs button{appearance:none;border:1px solid #6d8fbb;background:none;color:#fff;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--g);border-color:#fff}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#message{padding:32px 16px;text-align:center;color:#cfdbe8;font:16px system-ui,sans-serif}
.foot{padding:14px 16px 22px;text-align:center;color:#cfdbe8;font:14px/1.5 system-ui,sans-serif}
.foot a{color:#fff}
</style></head>
<body>
<nav class="tabs" id="tabs" aria-label="Language"></nav>
<main id="doc"><p id="message">Loading the Declaration…</p></main>
<p class="foot">Akoma Ntoso XML generated by Claude for Grant Vergottini. <a href="universal-declaration-of-human-rights.xml">View the XML with all six languages</a>.</p>
<script>
const L=[['eng','English'],['ara','العربية'],['zho','中文'],['fra','Français'],['rus','Русский'],['spa','Español']];
(async()=>{try{
const [x,c]=await Promise.all(['universal-declaration-of-human-rights.xml','universal-declaration-of-human-rights.css'].map(async f=>{const r=await fetch(f);if(!r.ok)throw 0;return r.text()}));
const d=new DOMParser().parseFromString(x,'application/xml');if(d.querySelector('parsererror'))throw 0;
const s=document.createElement('style');s.textContent=c;document.head.appendChild(s);
const root=document.importNode(d.documentElement,true);document.getElementById('doc').replaceChildren(root);
const comps=[...root.getElementsByTagNameNS('*','component')];
const tabs=document.getElementById('tabs');
const show=(k,push)=>{comps.forEach(n=>{n.toggleAttribute('hidden',n.getAttribute('eId')!=='cmp_'+k)});[...tabs.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===k)));if(push)try{history.replaceState(null,'','#'+k)}catch(e){}};
L.forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.dataset.k=k;b.lang=k;b.onclick=()=>show(k,true);tabs.appendChild(b)});
const h=location.hash.slice(1);show(L.some(l=>l[0]===h)?h:'eng');
}catch(e){document.getElementById('message').textContent='The document could not be loaded. Please reload this page.'}})();
</script>
</body></html>
